name: Release Gate

on:
  pull_request:
  push:
    tags:
      - "v*"

jobs:
  release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI
        run: npm run ci

      - name: Run release gate
        run: npm run gate:release
